<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#764ba2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>English Learning - Login</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo { font-size: 60px; margin-bottom: 15px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #764ba2; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(118,75,162,0.4); }
        .hidden { display: none !important; }
        .message { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
        }
        .toggle-link:hover { color: #764ba2; }
        .dev-badge {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #d35400;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🎓</div>
        <h1>English Learning</h1>
        <p class="subtitle" id="subtitle">Sign in to continue</p>
        
        <div id="devBadge" class="dev-badge hidden">🛠️ Developer Mode</div>
        
        <input type="email" id="email" placeholder="📧 Email">
        <input type="password" id="password" placeholder="🔑 Password">
        <input type="text" id="username" class="hidden" placeholder="👤 Username">
        
        <button onclick="handleLogin()" id="loginBtn">🚀 Login</button>
        <button onclick="handleLogin()" id="registerBtn" class="hidden">📝 Create Account</button>
        
        <div class="toggle-link" id="toggleText" onclick="toggleRegister()">
            Don't have an account? <strong>Sign Up</strong>
        </div>
                <div class="toggle-link" onclick="toggleDevMode()" style="margin-top: 15px;">⚙️ Developer Login?</div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // ✅ Toggle function works WITHOUT module imports
        let isRegisterMode = false;
        let isDevMode = false;

        window.toggleRegister = function() {
            console.log('Toggle clicked!');
            isRegisterMode = !isRegisterMode;
            
            const usernameField = document.getElementById('username');
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const toggleText = document.getElementById('toggleText');
            const subtitle = document.getElementById('subtitle');
            
            if (isRegisterMode) {
                usernameField.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                registerBtn.classList.remove('hidden');
                toggleText.innerHTML = 'Already have an account? <strong>Login</strong>';
                subtitle.innerText = 'Create your account';
                console.log('Register mode ON');
            } else {
                usernameField.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                registerBtn.classList.add('hidden');
                toggleText.innerHTML = "Don't have an account? <strong>Sign Up</strong>";
                subtitle.innerText = 'Sign in to continue';
                console.log('Register mode OFF');
            }
        };

        window.toggleDevMode = function() {
            isDevMode = !isDevMode;
            const badge = document.getElementById('devBadge');
            const message = document.getElementById('message');
            const toggleText = document.getElementById('toggleText');
            
            if (isDevMode) {
                badge.classList.remove('hidden');
                message.innerHTML = "<span class='error'>Developer: Use password 1234</span>";
                toggleText.classList.add('hidden');
            } else {
                badge.classList.add('hidden');
                message.innerHTML = "";                toggleText.classList.remove('hidden');
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;
            const message = document.getElementById('message');

            if (!email || !password) {
                message.innerHTML = "<span class='error'>❌ Please fill all fields!</span>";
                return;
            }

            message.innerHTML = "<span style='color:#764ba2'>⏳ Processing...</span>";

            try {
                // Import Appwrite dynamically
                const { createAccount, login, getUserData, createUserDocument, sendWelcomeNotification } = await import('./appwrite-config.js');

                if (isRegisterMode) {
                    if (!username) {
                        message.innerHTML = "<span class='error'>❌ Please enter username!</span>";
                        return;
                    }
                    const result = await createAccount(email, password, username);
                    
                    if (result.success) {
                        message.innerHTML = "<span class='success'>✅ Account created! Redirecting...</span>";
                        setTimeout(() => window.location.href = "dashboard.html", 1500);
                    } else {
                        message.innerHTML = "<span class='error'>❌ " + result.error + "</span>";
                    }
                } else {
                    const result = await login(email, password);
                    
                    if (result.success) {
                        if (isDevMode && password === "1234") {
                            message.innerHTML = "<span class='success'>✅ Admin login! Redirecting...</span>";
                            setTimeout(() => window.location.href = "admin.html", 1500);
                        } else {
                            message.innerHTML = "<span class='success'>✅ Login successful! Redirecting...</span>";
                            setTimeout(() => window.location.href = "dashboard.html", 1500);
                        }
                    } else {
                        message.innerHTML = "<span class='error'>❌ " + result.error + "</span>";
                    }
                }
            } catch (error) {                console.error('Error:', error);
                message.innerHTML = "<span class='error'>❌ " + error.message + "</span>";
            }
        };

        // Allow Enter key to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        console.log('✅ Login page loaded successfully!');
    </script>
</body>
</html>
